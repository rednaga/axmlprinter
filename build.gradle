plugins {
    id 'java'
    id 'jacoco'
    id 'maven-publish'
    id "io.github.ben-manes.versions" version "0.67.0"
    id 'com.google.protobuf' version '0.10.1'
}

version = '2.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.protobuf:protobuf-java:4.34.1'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    testImplementation 'org.mockito:mockito-core:5.24.0'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.34.1'
    }
}

allprojects {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked"
    }
}

jacocoTestReport {
    // The protobuf generated classes (com.android.aapt) dwarf the hand-written code and would
    // make the coverage number meaningless, so only report on our own sources
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: ['com/android/aapt/**'])
    }))

    reports {
        html.required.set(true)
        xml.required.set(true)
        csv.required.set(false)
    }
}

// The jar task is what gets published: just our classes, with protobuf as a normal dependency of the library.
// (It goes in its own directory so it can't clash with the runnable jar below, which has the same name.)
tasks.jar {
    destinationDirectory = layout.buildDirectory.dir('library')

    // Keep ./gradlew jar producing the runnable jar as well
    finalizedBy 'cliJar'
}

// The runnable jar for the command line tool: java -jar build/libs/axmlprinter-<version>.jar
tasks.register('cliJar', Jar) {
    group = 'build'
    description = 'Assembles the runnable command line jar, which bundles its dependencies.'

    destinationDirectory = layout.buildDirectory.dir('libs')
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    manifest {
        attributes 'Main-Class': 'diff.rednaga.AXMLPrinter'
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('assemble') {
    dependsOn 'cliJar'
}

// Fills in the version in axmlprinter.properties, which the command line tool prints
processResources {
    inputs.property('version', version)
    expand('version': version)
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            groupId = project.findProperty('group') ?: 'github.diff.strazzere.rednaga'
            artifactId = 'axmlprinter'
        }
    }
}

test {
    useJUnitPlatform()
    jvmArgs(
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.io=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED'
    )

    testLogging {
        events "passed", "skipped", "failed"
    }
}
