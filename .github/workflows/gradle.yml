# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    # build runs the tests and assembles the jar, jacocoTestReport writes the coverage report
    - name: Build, test and generate coverage report
      run: ./gradlew build jacocoTestReport

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: build/reports/jacoco/test/jacocoTestReport.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        # Don't fail the build if Codecov is down or the token isn't configured
        fail_ci_if_error: false

    - name: Upload JAR as artifact
      uses: actions/upload-artifact@v7
      with:
        name: axmlprinter-jar
        path: build/libs/*.jar
